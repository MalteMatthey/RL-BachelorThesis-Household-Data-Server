version: '3.8'
services:
  fastapi:
    build: .
    env_file:
      - .env
    environment:
      - DOCKER_ENV=1
    ports:
      - "8021:8021"
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run --url http://fastapi:8021
    depends_on:
      - fastapi
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}
    restart: unless-stopped
